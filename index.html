<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Caça-mosca</title>
    <script>
        function iniciarJogo(){
            var nivel= document.getElementById("nivel").value
            if (nivel === ""){
                alert("Selecione um nível para jogar!")
                return false
        }
        window.location.href="app.html?"+nivel
    }
    </script>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col">
                <div class="d-flex justify-content-center">
                    <img src="imagens/game.png">
                </div>
        </div>


        <div class="row">
            <div class="col">
                <div class="d-flex justify-content-center">
                    <div class="mb-2">
                        <select class="from-control" id="nivel">
                            <option value=""> --- Selecione o nível</option>
                            <option value="normal"> Normal </option>
                            <option value="normal"> Díficil </option>
                            <option value="normal"> Chunck Norris </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="d-flex justify-content-center">
                    <button type="button" class="btn btn-danger btn-lg" onclick="iniciarJogo()">
                        Iniciar Jogo
                    </button>
                </div>
            </div>
        </div>

    </div>
    
</body>
</html>
